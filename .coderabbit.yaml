# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Be concise and evidence-based. Prioritize correctness, tenant isolation, data integrity, offline idempotency, security and regression risk over style."
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "README.md"
      - "docs/governance/PRODUCT-OPERATING-SYSTEM.md"
      - "governance/product-gates.json"
      - "skills/karpathy-guidelines/SKILL.md"
      - "skills/warpath/SKILL.md"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  review_status: true
  review_progress: false
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "main"
      - "governance/product-operating-system"
      - "requalify/wave-2-sprints-06-10"
      - "feature/sprint-22-offline-sync"
      - "feature/sprint-23-security-audit"
      - "feature/sprint-24-regression-uat-closure"
  path_filters:
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/.expo/**"
    - "!**/node_modules/**"
  path_instructions:
    - path: "**"
      instructions: |
        Enforce AGENTS.md, docs/governance/PRODUCT-OPERATING-SYSTEM.md, governance/product-gates.json,
        the Karpathy guidelines, and Terrevo Warpath safety concerns. Treat the ten mandatory gates as qualification controls.
        Flag silent assumptions, unnecessary complexity, unrelated refactors, hidden scope expansion, breaking contracts,
        tenant-boundary failures, non-idempotent writes, missing validation, weakened tests, fake controls,
        unsupported PASS claims in evidence manifests, and UI changes unrelated to the PR.
        Every changed line should trace to the stated requirement. Any unresolved material finding blocks qualification.
    - path: "apps/mobile/**"
      instructions: |
        Focus on offline-first behavior, idempotent sync, GPS/time integrity, permissions,
        recovery after app restart and battery-conscious behavior.
    - path: "apps/api/**"
      instructions: |
        Focus on server authorization, tenant isolation, validation, idempotency, audit events,
        API compatibility and safe failure.
    - path: "modules/**"
      instructions: |
        Enforce domain ownership. Flag direct mutation of another module's internals.
    - path: "packages/ui/**"
      instructions: |
        Shared UI is protected. Flag changes unless SHARED UI CHANGE = YES.
    - path: "database/**"
      instructions: |
        Require migration safety, backward compatibility, tenant isolation and rollback consideration.
    - path: "docs/evidence/**"
      instructions: |
        Treat evidence as controlled qualification data. Flag unsupported PASS claims, missing reviewer/rationale,
        stale or non-ancestor qualified commits, fabricated test evidence, and COMPLETE status when required gates are not proven.
    - path: "governance/**"
      instructions: |
        Review governance changes fail-closed. Flag bypasses, optionalization of mandatory gates, self-attestation loopholes,
        or mechanisms that allow implementation to be called COMPLETE without exact-commit evidence.
chat:
  auto_reply: true
