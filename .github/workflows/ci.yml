name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:foundation
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check


  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install quality tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint core qualification scope
        run: npm run lint:core
      - name: Architecture and circular dependency checks
        run: npm run check:architecture:core
      - name: Dead code and dependency hygiene (core + web)
        run: npm run check:dead-code
      - name: Duplication threshold
        run: npm run check:duplication:core
      - name: Dependency vulnerability audit
        run: npm run check:dependency-audit
      - name: Product-gate verifier negative tests
        run: npm run test:product-gates
      - name: Governance evidence structure
        run: npm run verify:evidence-structure -- docs/evidence/TRV-GOV-001.product-gates.json
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan exact change range for secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  ui-applicability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      design: ${{ steps.resolve.outputs.design }}
      browser: ${{ steps.resolve.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve UI verification applicability from evidence
        id: resolve
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          manifest="$(printf '%s\n' "$PR_BODY" | sed -n 's/^- Evidence manifest: `\([^`]*\)`.*/\1/p' | head -n1)"
          test -n "$manifest" || { echo "Evidence manifest path missing from PR body"; exit 1; }
          test -f "$manifest" || { echo "Evidence manifest does not exist: $manifest"; exit 1; }

          evidence_root="$(realpath docs/evidence)"
          manifest_real="$(realpath "$manifest")"
          case "$manifest_real" in
            "$evidence_root"/*.product-gates.json) ;;
            *) echo "Evidence manifest must resolve inside docs/evidence"; exit 1 ;;
          esac

          MANIFEST="$manifest_real" node --input-type=module - <<'NODE'
          import fs from "node:fs";

          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
          const nonempty = value => typeof value === "string" && value.trim().length > 0;

          if (typeof manifest.impact?.ui !== "boolean") {
            console.error("impact.ui must be an explicit boolean");
            process.exit(1);
          }

          const resolve = id => {
            if (manifest.impact.ui === true) return "run";

            const status = manifest.automatedChecks?.[id];
            const applicability = manifest.automatedCheckApplicability?.[id];
            if (
              status !== "NOT_APPLICABLE" ||
              !nonempty(applicability?.reviewer) ||
              !nonempty(applicability?.rationale)
            ) {
              console.error(
                `${id} may skip only when the evidence manifest records reviewed NOT_APPLICABLE`
              );
              process.exit(1);
            }
            return "skip";
          };

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `design=${resolve("design_verification")}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `browser=${resolve("browser_verification")}\n`);
          NODE

  design-verification:
    needs: ui-applicability
    if: needs.ui-applicability.outputs.design == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Verify UI design evidence
        run: |
          if [ ! -f scripts/verify-ui-design.mjs ]; then
            echo "UI changes require a real design verification script."
            exit 1
          fi
          node scripts/verify-ui-design.mjs

  browser-verification:
    needs: ui-applicability
    if: needs.ui-applicability.outputs.browser == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Verify UI in a real browser
        run: |
          if [ ! -f scripts/verify-ui-browser.mjs ]; then
            echo "UI changes require a real browser verification script."
            exit 1
          fi
          node scripts/verify-ui-browser.mjs

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:android

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrevo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terrevo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: terrevo_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap Supabase-compatible roles and auth schema
        run: psql -v ON_ERROR_STOP=1 -f database/ci/supabase-bootstrap.sql
      - name: Apply all forward migrations
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply all rollback migrations in reverse
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.down.sql' -print0 | sort -zr | while IFS= read -r -d '' file; do
            echo "Rolling back $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

  scope-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require PR scope declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -q "## Scope Lock"
          printf '%s' "$PR_BODY" | grep -q "UI CHANGE"
          printf '%s' "$PR_BODY" | grep -q "DATABASE CHANGE"
          printf '%s' "$PR_BODY" | grep -q "API CONTRACT CHANGE"
