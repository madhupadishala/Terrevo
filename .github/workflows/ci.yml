name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:foundation
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check


  quality-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install quality tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint core qualification scope
        run: npm run lint:core
      - name: Architecture and circular dependency checks
        run: npm run check:architecture:core
      - name: Dead code and dependency hygiene (core + web)
        run: npm run check:dead-code
      - name: Duplication threshold
        run: npm run check:duplication:core
      - name: Dependency vulnerability audit
        run: npm run check:dependency-audit
      - name: Product-gate verifier negative tests
        run: npm run test:product-gates
      - name: Governance evidence structure
        run: npm run verify:evidence-structure -- docs/evidence/TRV-GOV-001.product-gates.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:android

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrevo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terrevo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: terrevo_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap Supabase-compatible roles and auth schema
        run: psql -v ON_ERROR_STOP=1 -f database/ci/supabase-bootstrap.sql
      - name: Apply all forward migrations
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply all rollback migrations in reverse
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.down.sql' -print0 | sort -zr | while IFS= read -r -d '' file; do
            echo "Rolling back $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

  scope-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require PR scope declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -q "## Scope Lock"
          printf '%s' "$PR_BODY" | grep -q "UI CHANGE"
          printf '%s' "$PR_BODY" | grep -q "DATABASE CHANGE"
          printf '%s' "$PR_BODY" | grep -q "API CONTRACT CHANGE"
