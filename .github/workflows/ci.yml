name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run verify:foundation
      - run: npm run verify:release
      - run: npm run test:release-safety
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: npm run build
      - run: git diff --check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:android

  browser-smoke:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrevo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terrevo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: terrevo_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap Supabase-compatible roles and auth schema
        run: psql -v ON_ERROR_STOP=1 -f database/ci/supabase-bootstrap.sql
      - name: Apply all forward migrations
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Platform administrator isolation and audit tests
        run: psql -v ON_ERROR_STOP=1 -f database/ci/platform-admin-policy-tests.sql
      - name: Public security definer and administrative RPC privilege isolation
        run: psql -v ON_ERROR_STOP=1 -f database/ci/public-definer-privileges-tests.sql
      - name: NCA tenant isolation and denied-write policy tests
        run: psql -v ON_ERROR_STOP=1 -f database/ci/nca-policy-tests.sql
      - name: Unplanned call persistence-security policy checks
        run: psql -v ON_ERROR_STOP=1 -f database/ci/unplanned-call-policy-tests.sql
      - name: Unplanned call PostgreSQL persistence and manager-review integration tests
        run: psql -v ON_ERROR_STOP=1 -f database/ci/unplanned-call-integration-tests.sql
      - name: Apply all rollback migrations in reverse
        run: |
          set -euo pipefail
          find database/migrations -maxdepth 1 -type f -name '*.down.sql' -print0 | sort -zr | while IFS= read -r -d '' file; do
            echo "Rolling back $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

  scope-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require PR scope declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -q "## Scope Lock"
          printf '%s' "$PR_BODY" | grep -q "UI CHANGE"
          printf '%s' "$PR_BODY" | grep -q "DATABASE CHANGE"
          printf '%s' "$PR_BODY" | grep -q "API CONTRACT CHANGE"
