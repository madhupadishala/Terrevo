name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run verify:foundation
      - run: git diff --check
  scope-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require PR scope declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | grep -q "## Scope Lock"
          printf '%s' "$PR_BODY" | grep -q "UI CHANGE"
          printf '%s' "$PR_BODY" | grep -q "DATABASE CHANGE"
          printf '%s' "$PR_BODY" | grep -q "API CONTRACT CHANGE"
